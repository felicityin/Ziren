[package]
name = "zkm-prover"
description = "Ziren prover"
readme = "../../README.md"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
p3-matrix = { workspace = true }
zkm-recursion-compiler = { workspace = true }
zkm-recursion-core = { workspace = true }
zkm-recursion-circuit = { workspace = true }
zkm-recursion-gnark-ffi = { workspace = true }
zkm-core-machine = { workspace = true }
zkm-hypercube = { workspace = true }
zkm-stark = { workspace = true }
p3-symmetric = { workspace = true }
slop-challenger = { workspace = true }
zkm-core-executor = { workspace = true }
zkm-primitives = { workspace = true }
p3-field = { workspace = true }
p3-challenger = { workspace = true }
p3-koala-bear = { workspace = true }
p3-bn254-fr = { workspace = true }
p3-commit = { workspace = true }
p3-util = { workspace = true }
bincode = "1.3.3"
serde = { workspace = true, features = ["derive", "rc"] }
itertools = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.5.9", features = ["derive", "env"] }
anyhow = "1.0.83"
dirs = "5.0.1"
num-bigint = "0.4.6"
thiserror = "1.0.63"
rayon = "1.10.0"
lru = "0.12.4"
eyre = "0.6.12"
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
test-artifacts = { workspace = true }
serial_test = "3.1.1"
slop-air = { workspace = true }

[[bin]]
name = "build_plonk_bn254"
path = "scripts/build_plonk_bn254.rs"

[[bin]]
name = "build_groth16_bn254"
path = "scripts/build_groth16_bn254.rs"

[[bin]]
name = "post_trusted_setup"
path = "scripts/post_trusted_setup.rs"

# `build_compress_vks` and `find_recursion_shapes` built the CoreShapeConfig-driven VK-catalog
# (vk_map.bin) used by the old shape-quantization/VK-determinism system. That system was removed
# from zkm_core_machine (task #24) with no hypercube-side replacement, and crates/prover/src/shapes.rs
# was gutted accordingly (task #63, 阶段5.1). Both scripts depended on the removed
# check_shapes/build_vk_map_to_file/ZKMCompressProgramShape APIs; out of scope for 阶段5.1 per the
# user's explicit "skip VK regen" instruction.

[features]
default = ["native-gnark"]
native-gnark = ["zkm-recursion-gnark-ffi/native"]
debug = ["zkm-core-machine/debug"]
# The Groth16 verification key (vk) is not affected by the Ziren upgrade.
imm-wrap-vk = ["zkm-recursion-core/imm-wrap-vk"]
